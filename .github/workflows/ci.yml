name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Boot the API and read data through it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate the demo dataset
        # Catches a generator that no longer matches the images in the repo.
        run: npm run generate:demo-data

      - name: Fail if the committed dataset is out of date
        run: |
          if ! git diff --quiet -- src/data; then
            echo "src/data differs from what the generator produces."
            echo "Run 'npm run generate:demo-data' and commit the result."
            git diff --stat -- src/data
            exit 1
          fi

      - name: Start the API
        run: npm start &

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:10000/api/checkConnection > /dev/null; then
              echo "API is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start within 30s"
          exit 1

      - name: Smoke test
        run: npm run smoke
