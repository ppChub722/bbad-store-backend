name: Check the deployed API

# Run this from the Actions tab before pointing anyone at the live demo.
#
# It runs the same smoke test as CI, but against the deployed URL instead of a
# fresh local process, so it answers the question CI cannot: is the thing that
# is actually running still serving data? The deployment once returned an empty
# catalogue for months because the database behind it had gone away, and
# nothing about the repository looked wrong.
#
# There is no schedule on purpose. A daily run would mostly send mail about a
# demo nobody is looking at, and GitHub disables scheduled workflows in quiet
# repositories anyway.

on:
  workflow_dispatch:

jobs:
  smoke-test-production:
    name: Read data through the live API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke test the deployment
        # The host sleeps when idle, so the first request pays a cold start.
        env:
          SMOKE_BASE_URL: https://bbad-store-backend.onrender.com
        run: |
          echo "Waking the service up first — this can take a minute."
          curl -s -o /dev/null --max-time 120 "$SMOKE_BASE_URL/api/checkConnection" || true
          node scripts/smoke-test.js
